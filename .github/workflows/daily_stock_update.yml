name: Daily Stock Comparison Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests python-dotenv

      - name: Check required files
        run: |
          test -f download_stock_prices_daily_update.py
          test -f stock_master.xlsx
          test -f stock_prices.xlsx

      - name: Run daily Upstox update
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python download_stock_prices_daily_update.py

      - name: Generate automated comparison charts
        run: |
          python generate_comparison_charts_auto.py

      - name: Show changes
        run: |
          git status --short

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock_prices.xlsx sector_charts

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily stock comparison update"
            git push origin HEAD:master
          fi
