<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Sector Comparison</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
  <div>
    <h1>Stock Sector Comparison</h1>
    <p class="subtitle">Daily relative performance • Starts from 0%</p>
  </div>
  <div id="latestDate" class="latest-date">Loading...</div>
</header>

<section class="controls">
  <div class="control"><label for="sectorSelect">Sector</label><select id="sectorSelect"></select></div>
  <div class="control"><label for="periodSelect">Period</label>
    <select id="periodSelect">
      <option value="1M">1M</option><option value="3M">3M</option>
      <option value="6M">6M</option><option value="YTD">YTD</option>
    </select>
  </div>
  <div class="control"><label for="stocksSelect">Stocks</label>
    <select id="stocksSelect"><option value="5">Top 5</option><option value="10">Top 10</option></select>
  </div>
</section>

<section class="chart-card">
  <div class="chart-header">
    <div><h2 id="chartTitle">Loading...</h2><span id="chartSubtitle"></span></div>
    <div id="legend" class="legend"></div>
  </div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
</section>

<section class="table-card">
<h2>Performance</h2>
<div class="table-wrap">
<table><thead><tr><th>Rank</th><th>Symbol</th><th>Company</th><th>Return</th></tr></thead>
<tbody id="performanceTable"></tbody></table>
</div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
